repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-executables-have-shebangs
    files: \.bash
  - id: check-json
  - id: check-vcs-permalinks
  - id: check-yaml
  - id: check-ast
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    # see https://github.com/gruntwork-io/pre-commit/releases
- repo: https://github.com/gruntwork-io/pre-commit
  rev: 40f924cd642f5dc98d12bd97b07f3752223553da  # frozen: v0.1.30
  hooks:
  - id: shellcheck
- repo: local
  hooks:
  - id: check-sh
    name: check bash scripts' formats
    entry: ./scripts/shfmt.bash
    language: script
